# Render Blueprint (https://render.com/docs/blueprint-spec). Deploys the Dockerfile as one web service.
services:
  - type: web
    name: proofmark
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: SEARCH_PROVIDER
        value: none
      - key: SEARCH_API_KEY
        sync: false
